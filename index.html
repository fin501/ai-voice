<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI 助理">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/860/860298.png">
  <link rel="manifest" href="manifest.json">
  <title>我的 AI 語音助理</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      text-align: center;
    }
    #key-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      gap: 8px;
    }
    #api-key-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
    }
    #save-key-btn {
      background-color: #34c759;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: bold;
    }
    #chat-box {
      width: 100%;
      max-width: 400px;
      flex: 1;
      background: white;
      border-radius: 15px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow-y: auto;
      margin: 14px 0;
    }
    .message { margin-bottom: 14px; text-align: left; line-height: 1.5; }
    .user-text { color: #007aff; font-weight: bold; }
    .ai-text { color: #333; }
    #talk-btn {
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 50%;
      width: 76px;
      height: 76px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,122,255,0.4);
    }
    #talk-btn:active { background-color: #005bb5; transform: scale(0.95); }
    #status { margin-top: 8px; color: #666; font-size: 14px; }
  </style>
</head>
<body>

  <div id="key-bar">
    <input type="password" id="api-key-input" placeholder="請在此貼上你的 API Key">
    <button id="save-key-btn">儲存</button>
  </div>

  <div id="chat-box">
    <div class="message ai-text">你好！請先在上方貼上 API Key 並按「儲存」，接著點擊下方按鈕跟我說話。</div>
  </div>

  <div>
    <button id="talk-btn">說話</button>
    <div id="status">準備就緒</div>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-TW';
    recognition.interimResults = false;

    const keyInput = document.getElementById('api-key-input');
    const saveKeyBtn = document.getElementById('save-key-btn');
    const talkBtn = document.getElementById('talk-btn');
    const statusText = document.getElementById('status');
    const chatBox = document.getElementById('chat-box');

    // 讀取儲存在手機裡的金鑰
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
      keyInput.value = savedKey;
      statusText.innerText = '已載入金鑰，準備就緒';
    }

    // 儲存金鑰到手機本機
    saveKeyBtn.addEventListener('click', () => {
      const val = keyInput.value.trim();
      if (!val) {
        statusText.innerText = '請先貼上 API Key';
        return;
      }
      localStorage.setItem('gemini_api_key', val);
      statusText.innerText = '金鑰已安全儲存在此手機！';
    });

    talkBtn.addEventListener('click', () => {
      const currentKey = localStorage.getItem('gemini_api_key') || keyInput.value.trim();
      if (!currentKey) {
        statusText.innerText = '請先在上方輸入並儲存 API Key';
        return;
      }

      const silentUtterance = new SpeechSynthesisUtterance(' ');
      window.speechSynthesis.speak(silentUtterance);

      recognition.start();
      statusText.innerText = '聆聽中... (請說話)';
      talkBtn.style.backgroundColor = '#ff3b30';
    });

    recognition.onresult = async (event) => {
      const userText = event.results[0][0].transcript;
      statusText.innerText = 'AI 思考中...';
      talkBtn.style.backgroundColor = '#007aff';
      appendMessage('user-text', '你: ' + userText);

      try {
        const aiResponse = await getAIResponse(userText);
        appendMessage('ai-text', 'AI: ' + aiResponse);
        speakText(aiResponse);
        statusText.innerText = '準備就緒';
      } catch (error) {
        appendMessage('ai-text', '錯誤訊息: ' + error.message);
        statusText.innerText = '發生錯誤';
      }
    };

    recognition.onerror = () => {
      statusText.innerText = '無法辨識語音，請再試一次。';
      talkBtn.style.backgroundColor = '#007aff';
    };

    async function getAIResponse(text) {
      const apiKey = localStorage.getItem('gemini_api_key') || keyInput.value.trim();
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: "請用簡短口語的繁體中文回答，不要使用任何符號或條列：" + text }] }]
        })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts[0].text;
    }

    function speakText(text) {
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*#`]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'zh-TW';
      window.speechSynthesis.speak(utterance);
    }

    function appendMessage(className, text) {
      const div = document.createElement('div');
      div.className = `message ${className}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
